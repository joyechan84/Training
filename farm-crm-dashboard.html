<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>농장 순회 CRM</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>

<style>
  /* ---------- Design tokens ---------- */
  :root {
    --bg: #eef3ea;
    --furrow: rgba(31, 92, 61, 0.05);
    --surface: #ffffff;
    --surface-2: #eef3ea;
    --border: #d8e3d3;
    --ink: #182219;
    --ink-soft: #5b6b5c;
    --ink-faint: #8a988a;
    --brand: #1f5c3d;
    --brand-strong: #123822;
    --brand-tint: #dcece1;
    --accent: #b1812c;
    --accent-tint: #f3e6c8;
    --ok: #257a4a;
    --ok-tint: #dcf0e2;
    --warn: #a6741f;
    --warn-tint: #f7ecd2;
    --danger: #a63a2f;
    --danger-tint: #f6dfda;
    --shadow: 24, 38, 26;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1811;
      --furrow: rgba(111, 190, 140, 0.045);
      --surface: #172119;
      --surface-2: #1d2a20;
      --border: #2b3a2d;
      --ink: #eaf1e7;
      --ink-soft: #a2b3a1;
      --ink-faint: #71826f;
      --brand: #6fc491;
      --brand-strong: #8fd6ac;
      --brand-tint: rgba(111, 196, 145, 0.16);
      --accent: #e0b85c;
      --accent-tint: rgba(224, 184, 92, 0.16);
      --ok: #5cbf85;
      --ok-tint: rgba(92, 191, 133, 0.16);
      --warn: #e0ab52;
      --warn-tint: rgba(224, 171, 82, 0.16);
      --danger: #e08475;
      --danger-tint: rgba(224, 132, 117, 0.16);
      --shadow: 0, 0, 0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1811;
    --furrow: rgba(111, 190, 140, 0.045);
    --surface: #172119;
    --surface-2: #1d2a20;
    --border: #2b3a2d;
    --ink: #eaf1e7;
    --ink-soft: #a2b3a1;
    --ink-faint: #71826f;
    --brand: #6fc491;
    --brand-strong: #8fd6ac;
    --brand-tint: rgba(111, 196, 145, 0.16);
    --accent: #e0b85c;
    --accent-tint: rgba(224, 184, 92, 0.16);
    --ok: #5cbf85;
    --ok-tint: rgba(92, 191, 133, 0.16);
    --warn: #e0ab52;
    --warn-tint: rgba(224, 171, 82, 0.16);
    --danger: #e08475;
    --danger-tint: rgba(224, 132, 117, 0.16);
    --shadow: 0, 0, 0;
  }

  html, body { background: var(--bg); }
  body {
    font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color: var(--ink);
    background-color: var(--bg);
    background-image: repeating-linear-gradient(115deg, transparent, transparent 25px, var(--furrow) 25px, var(--furrow) 27px);
  }
  .font-wordmark { font-family: 'Gowun Batang', Georgia, 'Nanum Myeongjo', serif; }
  .font-mono { font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace; font-variant-numeric: tabular-nums; }
  #app-shell {
    background: var(--surface);
    box-shadow: 0 1px 2px rgba(var(--shadow), 0.06), 0 20px 44px -20px rgba(var(--shadow), 0.28);
    position: relative;
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
  .tap-active { -webkit-tap-highlight-color: transparent; transition: transform .12s ease; }
  .tap-active:active { transform: scale(0.97); }
  h1, h2, h3 { text-wrap: balance; }

  .field {
    width: 100%;
    font-size: 0.875rem;
    padding: 0.65rem 0.8rem;
    border-radius: 0.75rem;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
  }
  .field:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  .field-label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: .02em;
    color: var(--ink-soft);
    margin-bottom: 0.3rem;
    display: block;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(28px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-backdrop { animation: fadeIn .18s ease-out; }
  .modal-sheet { animation: slideUp .22s cubic-bezier(.2,.9,.3,1); }

  @media (prefers-reduced-motion: reduce) {
    .modal-backdrop, .modal-sheet { animation: none; }
    .tap-active, .tap-active:active { transition: none; transform: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel-source" id="app-source">
const { useState, useEffect, useRef, useMemo } = React;

/* ------------------------- 상수 / 유틸 ------------------------- */

const LIVESTOCK = {
  hanwoo: { label: "한우", icon: "🐂" },
  dairy:  { label: "낙농", icon: "🐄" },
  pig:    { label: "양돈", icon: "🐖" },
  poultry:{ label: "양계", icon: "🐔" },
};

// c: 강조색(점/텍스트/스트라이프) 변수명, tint: 배경 변수명
const STATUS = {
  normal:  { label: "정상",      c: "--ok",     tint: "--ok-tint" },
  caution: { label: "관심 필요",  c: "--warn",   tint: "--warn-tint" },
  danger:  { label: "위험",      c: "--danger", tint: "--danger-tint" },
};

const MONTH_TAG_LABELS = ["전전월", "전월", "이번달"];

const STORAGE_KEYS = {
  farms: "farmCrm.farms.v1",
  clientId: "farmCrm.naverClientId.v1",
  profile: "farmCrm.profile.v1",
};

const cssVar = (name) => `var(${name})`;

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function daysSince(dateStr) {
  if (!dateStr) return null;
  const [y, m, d] = dateStr.split("-").map(Number);
  const then = new Date(y, m - 1, d).getTime();
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  return Math.round((today - then) / 86400000);
}

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}

function saveJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) { /* 저장 공간이 없거나 접근이 막힌 경우 조용히 무시 */ }
}

/* ---------------- 네이버 지도 로더 / 지오코딩 ---------------- */

function ensureNaverMaps(clientId) {
  if (!clientId) return Promise.reject(new Error("NO_KEY"));
  if (window.naver && window.naver.maps && window.naver.maps.Service) return Promise.resolve(window.naver.maps);
  if (window.__naverMapsPromise && window.__naverMapsClientId === clientId) return window.__naverMapsPromise;

  window.__naverMapsClientId = clientId;
  window.__naverMapsPromise = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://openapi.map.naver.com/openapi/v3/maps.js?ncpClientId=" + encodeURIComponent(clientId) + "&submodules=geocoder";
    script.onload = () => {
      if (window.naver && window.naver.maps) resolve(window.naver.maps);
      else reject(new Error("SCRIPT_LOAD_FAILED"));
    };
    script.onerror = () => reject(new Error("SCRIPT_LOAD_FAILED"));
    document.head.appendChild(script);
  });
  return window.__naverMapsPromise;
}

function geocodeAddress(address) {
  return new Promise((resolve) => {
    if (!window.naver || !window.naver.maps || !window.naver.maps.Service) { resolve(null); return; }
    window.naver.maps.Service.geocode({ query: address }, (status, response) => {
      if (status !== window.naver.maps.Service.Status.OK) { resolve(null); return; }
      const list = response.v2 && response.v2.addresses;
      if (!list || list.length === 0) { resolve(null); return; }
      const item = list[0];
      resolve({
        lat: parseFloat(item.y),
        lng: parseFloat(item.x),
        formatted: item.roadAddress || item.jibunAddress || address,
      });
    });
  });
}

/* ------------------------- 서브 컴포넌트 ------------------------- */

function StatusChip({ status }) {
  const s = STATUS[status];
  return (
    <span
      className="inline-flex items-center gap-1.5 text-xs font-bold px-2.5 py-1 rounded-full"
      style={{ background: cssVar(s.tint), color: cssVar(s.c) }}
    >
      <span className="w-1.5 h-1.5 rounded-full" style={{ background: cssVar(s.c) }}></span>
      {s.label}
    </span>
  );
}

function Header({ profile, todayCount, onOpenSettings }) {
  const initial = profile.name ? profile.name.slice(-1) : "👤";
  return (
    <header
      className="text-white px-5 pt-7 pb-8 rounded-b-[28px]"
      style={{ background: `linear-gradient(160deg, var(--brand-strong), var(--brand))` }}
    >
      <div className="flex items-center justify-between">
        <div>
          <p className="text-[11px] font-medium tracking-wide text-white/70">
            {profile.region ? profile.region : "담당 구역 미설정 · 설정에서 입력"}
          </p>
          <h1 className="font-wordmark text-2xl font-bold mt-1">농장 순회 CRM</h1>
        </div>
        <button
          onClick={onOpenSettings}
          className="tap-active w-11 h-11 rounded-full bg-white/15 flex items-center justify-center text-base font-semibold ring-1 ring-white/25"
          aria-label="설정"
        >
          {initial}
        </button>
      </div>

      <div className="grid grid-cols-2 gap-3 mt-6">
        <div className="bg-white/10 rounded-2xl p-4">
          <p className="text-[11px] text-white/70 font-medium tracking-wide">오늘 방문 예정</p>
          <p className="font-mono text-[28px] font-semibold mt-1.5 leading-none">
            {todayCount}<span className="text-sm font-medium ml-1 text-white/80">곳</span>
          </p>
        </div>
        <div className="bg-white/10 rounded-2xl p-4">
          <p className="text-[11px] text-white/70 font-medium tracking-wide">이번 달 목표 달성률</p>
          <p className="font-mono text-[28px] font-semibold mt-1.5 leading-none">
            {profile.targetRate}<span className="text-sm font-medium ml-1 text-white/80">%</span>
          </p>
          <div className="w-full h-1.5 bg-white/20 rounded-full mt-2.5 overflow-hidden">
            <div className="h-full bg-white rounded-full" style={{ width: Math.min(100, Math.max(0, profile.targetRate)) + "%" }} />
          </div>
        </div>
      </div>
    </header>
  );
}

function ViewToggle({ view, setView }) {
  const items = [
    { key: "list", label: "목록" },
    { key: "map", label: "지도" },
  ];
  return (
    <div className="flex gap-2 px-5 mt-5">
      {items.map(it => {
        const active = view === it.key;
        return (
          <button
            key={it.key}
            onClick={() => setView(it.key)}
            className="tap-active flex-1 py-2.5 rounded-xl text-sm font-semibold border"
            style={active
              ? { background: cssVar("--brand"), borderColor: cssVar("--brand"), color: "#fff" }
              : { background: cssVar("--surface"), borderColor: cssVar("--border"), color: cssVar("--ink-soft") }}
          >
            {it.label}
          </button>
        );
      })}
    </div>
  );
}

function FilterBar({ statusFilter, setStatusFilter, livestockFilter, setLivestockFilter }) {
  const statusChips = [
    { key: "all", label: "전체 보기" },
    { key: "risk", label: "⚠ 위험·관심만" },
  ];
  return (
    <div className="px-5 mt-3 space-y-2.5">
      <div className="flex gap-2">
        {statusChips.map(c => {
          const active = statusFilter === c.key;
          return (
            <button
              key={c.key}
              onClick={() => setStatusFilter(c.key)}
              className="tap-active flex-1 py-2 rounded-xl text-xs font-semibold border"
              style={active
                ? { background: cssVar("--brand-tint"), borderColor: cssVar("--brand"), color: cssVar("--brand") }
                : { background: cssVar("--surface"), borderColor: cssVar("--border"), color: cssVar("--ink-soft") }}
            >
              {c.label}
            </button>
          );
        })}
      </div>

      <div className="flex gap-2 overflow-x-auto pb-1 -mx-5 px-5">
        <button
          onClick={() => setLivestockFilter("all")}
          className="tap-active shrink-0 px-3.5 py-2 rounded-full text-xs font-semibold border"
          style={livestockFilter === "all"
            ? { background: cssVar("--brand-tint"), borderColor: cssVar("--brand"), color: cssVar("--brand") }
            : { background: cssVar("--surface"), borderColor: cssVar("--border"), color: cssVar("--ink-faint") }}
        >
          축종 전체
        </button>
        {Object.entries(LIVESTOCK).map(([key, v]) => {
          const active = livestockFilter === key;
          return (
            <button
              key={key}
              onClick={() => setLivestockFilter(key)}
              className="tap-active shrink-0 px-3.5 py-2 rounded-full text-xs font-semibold border flex items-center gap-1"
              style={active
                ? { background: cssVar("--brand-tint"), borderColor: cssVar("--brand"), color: cssVar("--brand") }
                : { background: cssVar("--surface"), borderColor: cssVar("--border"), color: cssVar("--ink-faint") }}
            >
              <span>{v.icon}</span>{v.label}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function FarmCard({ farm, onClick }) {
  const s = STATUS[farm.status];
  const l = LIVESTOCK[farm.livestock];
  const dSince = daysSince(farm.lastVisitDate);
  return (
    <button
      onClick={onClick}
      className="tap-active w-full text-left rounded-2xl pl-4 pr-3.5 py-4 flex items-center gap-3 border-l-4"
      style={{
        background: cssVar("--surface"),
        borderColor: cssVar("--border"),
        borderLeftColor: cssVar(s.c),
        boxShadow: `0 1px 2px rgba(var(--shadow), 0.04), 0 8px 20px -14px rgba(var(--shadow), 0.35)`,
        borderTopWidth: "1px", borderRightWidth: "1px", borderBottomWidth: "1px",
      }}
    >
      <div className="w-12 h-12 rounded-xl flex items-center justify-center text-2xl shrink-0" style={{ background: cssVar("--surface-2") }}>
        {l.icon}
      </div>

      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-1.5">
          <h3 className="font-bold truncate">{farm.name}</h3>
          {farm.nextVisitDate === todayStr() && (
            <span className="shrink-0 text-[10px] font-bold px-1.5 py-0.5 rounded-md tracking-wide" style={{ background: cssVar("--accent-tint"), color: cssVar("--accent") }}>
              오늘 방문
            </span>
          )}
        </div>
        <p className="text-xs mt-0.5 font-mono truncate" style={{ color: cssVar("--ink-faint") }}>
          {l.label} · {dSince === null ? "방문 기록 없음" : `마지막 방문 D-${dSince}`}
        </p>
        {farm.address && (
          <p className="text-[11px] mt-0.5 truncate" style={{ color: cssVar("--ink-faint") }}>📍 {farm.address}</p>
        )}
      </div>

      <div className="flex flex-col items-end gap-1.5 shrink-0">
        <StatusChip status={farm.status} />
        <span style={{ color: cssVar("--ink-faint") }} className="text-lg leading-none">›</span>
      </div>
    </button>
  );
}

function OrderChart({ orders }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const hasData = orders.some(v => v > 0);

  useEffect(() => {
    if (!hasData || !canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();

    const style = getComputedStyle(document.documentElement);
    const brand = style.getPropertyValue("--brand").trim();
    const ink = style.getPropertyValue("--ink-soft").trim();
    const grid = style.getPropertyValue("--border").trim();

    chartRef.current = new Chart(canvasRef.current, {
      type: "bar",
      data: {
        labels: MONTH_TAG_LABELS,
        datasets: [{ label: "주문량 (톤)", data: orders, backgroundColor: brand, borderRadius: 8, maxBarThickness: 44 }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, grid: { color: grid }, ticks: { color: ink, font: { size: 11, family: "'IBM Plex Mono', monospace" } } },
          x: { grid: { display: false }, ticks: { color: ink, font: { size: 12, weight: "600", family: "'IBM Plex Sans KR', sans-serif" } } },
        },
      },
    });

    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [orders, hasData]);

  if (!hasData) {
    return (
      <p className="text-xs py-8 text-center" style={{ color: cssVar("--ink-faint") }}>
        최근 주문 데이터가 없습니다.
      </p>
    );
  }
  return <div className="h-40 mt-2"><canvas ref={canvasRef}></canvas></div>;
}

/* ---------------- 지도 뷰 ---------------- */

function NaverMapView({ farms, clientId, onSelect }) {
  const mapDivRef = useRef(null);
  const mapObjRef = useRef(null);
  const markersRef = useRef([]);
  const [mapState, setMapState] = useState(clientId ? "loading" : "no-key");

  useEffect(() => {
    if (!clientId) { setMapState("no-key"); return; }
    let cancelled = false;
    setMapState("loading");
    ensureNaverMaps(clientId)
      .then((maps) => {
        if (cancelled || !mapDivRef.current) return;
        mapObjRef.current = new maps.Map(mapDivRef.current, {
          center: new maps.LatLng(36.5, 127.8),
          zoom: 7,
        });
        setMapState("ready");
      })
      .catch(() => { if (!cancelled) setMapState("error"); });
    return () => { cancelled = true; };
  }, [clientId]);

  useEffect(() => {
    if (mapState !== "ready" || !window.naver || !mapObjRef.current) return;
    const maps = window.naver.maps;

    markersRef.current.forEach(m => m.setMap(null));
    markersRef.current = [];

    const located = farms.filter(f => typeof f.lat === "number" && typeof f.lng === "number");
    const style = getComputedStyle(document.documentElement);

    located.forEach(farm => {
      const color = style.getPropertyValue(STATUS[farm.status].c).trim();
      const marker = new maps.Marker({
        position: new maps.LatLng(farm.lat, farm.lng),
        map: mapObjRef.current,
        icon: {
          content: `<div style="width:16px;height:16px;border-radius:50%;background:${color};border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)"></div>`,
          anchor: new maps.Point(8, 8),
        },
        title: farm.name,
      });
      maps.Event.addListener(marker, "click", () => onSelect(farm));
      markersRef.current.push(marker);
    });

    if (located.length > 0) {
      const bounds = new maps.LatLngBounds(new maps.LatLng(located[0].lat, located[0].lng), new maps.LatLng(located[0].lat, located[0].lng));
      located.forEach(f => bounds.extend(new maps.LatLng(f.lat, f.lng)));
      mapObjRef.current.fitBounds(bounds, { top: 40, right: 40, bottom: 40, left: 40 });
    }
  }, [farms, mapState]);

  if (mapState === "no-key") {
    return (
      <div className="mx-5 mt-4 rounded-2xl border p-5 text-center" style={{ borderColor: cssVar("--border"), background: cssVar("--surface-2") }}>
        <p className="text-2xl mb-2">🗺️</p>
        <p className="text-sm font-semibold">네이버 지도 API 키가 설정되지 않았어요</p>
        <p className="text-xs mt-1.5" style={{ color: cssVar("--ink-soft") }}>
          우측 상단 설정(프로필 아이콘)에서 네이버 지도 Client ID를 등록하면<br />농장 주소가 실제 지도에 표시됩니다.
        </p>
      </div>
    );
  }
  if (mapState === "error") {
    return (
      <div className="mx-5 mt-4 rounded-2xl border p-5 text-center" style={{ borderColor: cssVar("--danger"), background: cssVar("--danger-tint") }}>
        <p className="text-sm font-semibold" style={{ color: cssVar("--danger") }}>지도를 불러오지 못했습니다</p>
        <p className="text-xs mt-1.5" style={{ color: cssVar("--ink-soft") }}>
          Client ID가 올바른지, 그리고 네이버 클라우드 콘솔에 현재 접속 주소가<br />허용된 Web 서비스 URL로 등록되어 있는지 확인해 주세요.
        </p>
      </div>
    );
  }

  return (
    <div className="px-5 mt-4">
      <div ref={mapDivRef} className="w-full h-[320px] rounded-2xl border overflow-hidden" style={{ borderColor: cssVar("--border") }}>
        {mapState === "loading" && (

/* ---------------- 농장 등록 / 수정 폼 ---------------- */

function emptyFarmDraft() {
  return {
    name: "", livestock: "hanwoo", status: "normal", owner: "", phone: "",
    address: "", product: "", orders: [0, 0, 0], lastVisitDate: "", nextVisitDate: "", note: "",
  };
}

function FarmFormModal({ initialFarm, clientId, onCancel, onSubmit }) {
  const isEdit = !!initialFarm;
  const [draft, setDraft] = useState(() => initialFarm ? { ...emptyFarmDraft(), ...initialFarm } : emptyFarmDraft());
  const [saving, setSaving] = useState(false);
  const [geoNote, setGeoNote] = useState("");

  const setField = (key, value) => setDraft(d => ({ ...d, [key]: value }));
  const setOrder = (idx, value) => setDraft(d => {
    const orders = [...d.orders];
    orders[idx] = Number(value) || 0;
    return { ...d, orders };
  });

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!draft.name.trim() || !draft.address.trim()) return;
    setSaving(true);
    setGeoNote("");

    let lat = isEdit ? initialFarm.lat : undefined;
    let lng = isEdit ? initialFarm.lng : undefined;
    const addressChanged = !isEdit || initialFarm.address !== draft.address;

    if (addressChanged) {
      lat = undefined; lng = undefined;
      try {
        await ensureNaverMaps(clientId);
        const geo = await geocodeAddress(draft.address);
        if (geo) { lat = geo.lat; lng = geo.lng; }
        else setGeoNote("주소를 찾지 못했어요. 저장은 되지만 지도에는 표시되지 않아요.");
      } catch (err) {
        setGeoNote("지도 API 키가 설정되지 않아 좌표를 확인하지 못했어요. 설정에서 키를 등록해 보세요.");
      }
    }

    const farm = {
      ...draft,
      id: isEdit ? initialFarm.id : (Date.now() + "-" + Math.random().toString(36).slice(2, 7)),
      lat, lng,
    };
    setSaving(false);
    onSubmit(farm);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center modal-backdrop">
      <div className="absolute inset-0 bg-black/45" onClick={onCancel}></div>
      <div className="modal-sheet relative w-full max-w-[430px] rounded-t-3xl max-h-[92vh] overflow-y-auto" style={{ background: cssVar("--surface") }}>
        <div className="sticky top-0 pt-3 pb-3 px-5 rounded-t-3xl border-b flex items-center justify-between" style={{ background: cssVar("--surface"), borderColor: cssVar("--border") }}>
          <h2 className="text-base font-bold">{isEdit ? "농장 정보 수정" : "새 농장 등록"}</h2>
          <button onClick={onCancel} className="tap-active w-9 h-9 rounded-full flex items-center justify-center text-lg" style={{ background: cssVar("--surface-2"), color: cssVar("--ink-soft") }}>✕</button>
        </div>

        <form onSubmit={handleSubmit} className="p-5 space-y-4">
          <div>
            <label className="field-label">농장명 *</label>
            <input className="field" required value={draft.name} onChange={e => setField("name", e.target.value)} placeholder="예: 한라농장" />
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="field-label">사육 축종</label>
              <select className="field" value={draft.livestock} onChange={e => setField("livestock", e.target.value)}>
                {Object.entries(LIVESTOCK).map(([k, v]) => <option key={k} value={k}>{v.icon} {v.label}</option>)}
              </select>
            </div>
            <div>
              <label className="field-label">상태</label>
              <select className="field" value={draft.status} onChange={e => setField("status", e.target.value)}>
                {Object.entries(STATUS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
              </select>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="field-label">농장주</label>
              <input className="field" value={draft.owner} onChange={e => setField("owner", e.target.value)} placeholder="이름" />
            </div>
            <div>
              <label className="field-label">연락처</label>
              <input className="field" value={draft.phone} onChange={e => setField("phone", e.target.value)} placeholder="010-0000-0000" />
            </div>
          </div>

          <div>
            <label className="field-label">주소 *</label>
            <input className="field" required value={draft.address} onChange={e => setField("address", e.target.value)} placeholder="예: 제주특별자치도 제주시 ○○로 123" />
            <p className="text-[11px] mt-1.5" style={{ color: cssVar("--ink-faint") }}>저장하면 자동으로 지도 좌표를 찾아 지도 탭에 표시돼요.</p>
          </div>

          <div>
            <label className="field-label">현재 사용 사료 제품</label>
            <input className="field" value={draft.product} onChange={e => setField("product", e.target.value)} placeholder="예: 한우비육사료 A+" />
          </div>

          <div>
            <label className="field-label">최근 3개월 주문량 (톤)</label>
            <div className="grid grid-cols-3 gap-2">
              {MONTH_TAG_LABELS.map((label, idx) => (
                <div key={label}>
                  <input type="number" min="0" className="field text-center font-mono" value={draft.orders[idx]} onChange={e => setOrder(idx, e.target.value)} />
                  <p className="text-[10px] text-center mt-1" style={{ color: cssVar("--ink-faint") }}>{label}</p>
                </div>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="field-label">마지막 방문일</label>
              <input type="date" className="field" value={draft.lastVisitDate} onChange={e => setField("lastVisitDate", e.target.value)} />
            </div>
            <div>
              <label className="field-label">다음 방문 예정일</label>
              <input type="date" className="field" value={draft.nextVisitDate} onChange={e => setField("nextVisitDate", e.target.value)} />
            </div>
          </div>

          <div>
            <label className="field-label">특이사항 메모</label>
            <textarea className="field resize-none" rows={3} value={draft.note} onChange={e => setField("note", e.target.value)} placeholder="예: 최근 폭염으로 섭취량 저하 호소" />
          </div>

          {geoNote && (
            <p className="text-xs rounded-lg p-2.5" style={{ background: cssVar("--warn-tint"), color: cssVar("--warn") }}>{geoNote}</p>
          )}

          <button type="submit" disabled={saving} className="tap-active w-full py-3.5 rounded-xl text-white font-bold text-sm disabled:opacity-60" style={{ background: cssVar("--brand") }}>
            {saving ? "좌표 확인 중..." : isEdit ? "수정 완료" : "농장 등록"}
          </button>
        </form>
      </div>
    </div>
  );
}

/* ------------------------- 메인 앱 ------------------------- */

function App() {
  const [farms, setFarms] = useState(() => loadJSON(STORAGE_KEYS.farms, []));
  const [clientId, setClientId] = useState(() => loadJSON(STORAGE_KEYS.clientId, ""));
  const [profile, setProfile] = useState(() => loadJSON(STORAGE_KEYS.profile, { name: "", region: "", targetRate: 0 }));

  const [view, setView] = useState("list");
  const [statusFilter, setStatusFilter] = useState("all");
  const [livestockFilter, setLivestockFilter] = useState("all");

  const [selectedFarm, setSelectedFarm] = useState(null);
  const [formState, setFormState] = useState(null); // null | { mode: 'create' } | { mode: 'edit', farm }
  const [showSettings, setShowSettings] = useState(false);

  useEffect(() => saveJSON(STORAGE_KEYS.farms, farms), [farms]);
  useEffect(() => saveJSON(STORAGE_KEYS.profile, profile), [profile]);

  useEffect(() => {
    if (clientId) ensureNaverMaps(clientId).catch(() => {});
  }, [clientId]);

  const todayCount = useMemo(() => farms.filter(f => f.nextVisitDate === todayStr()).length, [farms]);

  const filteredFarms = useMemo(() => {
    return farms.filter(f => {
      if (statusFilter === "risk" && f.status === "normal") return false;
      if (livestockFilter !== "all" && f.livestock !== livestockFilter) return false;
      return true;
    });
  }, [farms, statusFilter, livestockFilter]);

  const handleCreateSubmit = (farm) => { setFarms(list => [farm, ...list]); setFormState(null); };
  const handleEditSubmit = (farm) => {
    setFarms(list => list.map(f => f.id === farm.id ? farm : f));
    setFormState(null);
    setSelectedFarm(farm);
  };
  const handleDelete = (id) => { setFarms(list => list.filter(f => f.id !== id)); setSelectedFarm(null); };

  const handleSaveClientId = (id) => {
    setClientId(id);
    saveJSON(STORAGE_KEYS.clientId, id);
    setShowSettings(false);
    window.location.reload();
  };

  return (
    <div id="app-shell" className="max-w-[430px] mx-auto min-h-screen pb-24">
      <Header profile={profile} todayCount={todayCount} onOpenSettings={() => setShowSettings(true)} />
      <ViewToggle view={view} setView={setView} />

      {view === "list" && farms.length > 0 && (
        <FilterBar statusFilter={statusFilter} setStatusFilter={setStatusFilter} livestockFilter={livestockFilter} setLivestockFilter={setLivestockFilter} />
      )}

      {view === "list" ? (
        <main className="px-5 mt-4 space-y-3">
          {farms.length === 0 ? (
            <div className="text-center py-16 px-4">
              <p className="text-4xl mb-3">🌱</p>
              <p className="text-sm font-semibold">아직 등록된 농장이 없어요</p>
              <p className="text-xs mt-1.5" style={{ color: cssVar("--ink-faint") }}>담당 구역의 농장 정보를 직접 등록해 보세요.</p>
              <button onClick={() => setFormState({ mode: "create" })} className="tap-active mt-5 px-5 py-2.5 rounded-xl text-white font-bold text-sm" style={{ background: cssVar("--brand") }}>
                + 첫 농장 등록하기
              </button>
            </div>
          ) : filteredFarms.length === 0 ? (
            <div className="text-center py-16" style={{ color: cssVar("--ink-faint") }}>
              <p className="text-4xl mb-2">🌿</p>
              <p className="text-sm font-medium">조건에 맞는 농장이 없습니다.</p>
            </div>
          ) : (
            filteredFarms.map(farm => <FarmCard key={farm.id} farm={farm} onClick={() => setSelectedFarm(farm)} />)
          )}
        </main>
      ) : (
        <NaverMapView farms={farms} clientId={clientId} onSelect={setSelectedFarm} />
      )}

      {farms.length > 0 && (
        <button
          onClick={() => setFormState({ mode: "create" })}
          className="tap-active fixed bottom-6 right-6 w-14 h-14 rounded-full text-white text-2xl font-bold flex items-center justify-center z-30"
          style={{ background: cssVar("--brand"), boxShadow: "0 10px 24px -8px rgba(var(--shadow), 0.5)" }}
          aria-label="농장 추가"
        >
          +
        </button>
      )}

      {selectedFarm && (
        <FarmDetailModal
          farm={selectedFarm}
          onClose={() => setSelectedFarm(null)}
          onEdit={(farm) => { setSelectedFarm(null); setFormState({ mode: "edit", farm }); }}
          onDelete={handleDelete}
        />
      )}

      {formState && (
        <FarmFormModal
          initialFarm={formState.mode === "edit" ? formState.farm : null}
          clientId={clientId}
          onCancel={() => setFormState(null)}
          onSubmit={formState.mode === "edit" ? handleEditSubmit : handleCreateSubmit}
        />
      )}

      {showSettings && (
        <SettingsModal
          profile={profile}
          clientId={clientId}
          onClose={() => setShowSettings(false)}
          onSaveProfile={(p) => { setProfile(p); setShowSettings(false); }}
          onSaveClientId={handleSaveClientId}
          onResetAll={() => { setFarms([]); setShowSettings(false); }}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

    presets: [["react", { runtime: "classic" }]],
    filename: "app.jsx",
  }).code;
  var scriptEl = document.createElement("script");
  scriptEl.text = transformed;
  document.body.appendChild(scriptEl);
</script>
</body>
