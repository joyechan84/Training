name: Build WorshipBand AI Android APK

on:
  workflow_dispatch: {}

defaults:
  run:
    working-directory: worshipband-ai

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: worshipband-ai/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Remove expo-dev-client for this standalone build
        # expo-dev-client (and its expo-dev-launcher/expo-dev-menu deps) is
        # dev-only tooling: during `expo prebuild` it rewrites the generated
        # MainApplication/MainActivity to boot into a "connect to a Metro dev
        # server" launcher instead of the app itself. A release APK built with
        # it still present installed fine on a real phone but crashed on
        # launch. Standalone/preview builds shouldn't include it at all (this
        # mirrors how EAS itself only includes it in "development" build
        # profiles, never "preview"/"production"). --no-save keeps this local
        # to the CI runner's checkout; package.json/lockfile in the repo are
        # untouched, so `expo start --dev-client` still works for local dev.
        run: npm uninstall expo-dev-client --no-save

      - name: Expo prebuild (generate native android/ project)
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild -p android --no-install

      - name: Build release APK
        # A debug build (assembleDebug) doesn't embed the JS bundle — it expects
        # a Metro dev server to connect to at runtime, which is why opening it
        # shows the "Development servers" launcher screen instead of the app.
        # assembleRelease bundles the JS into the APK (signed with the default
        # debug keystore, since no custom release signing is configured here)
        # so it launches standalone on the tablet with no dev server needed.
        working-directory: worshipband-ai/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: worshipband-ai-release-apk
          path: worshipband-ai/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      # Standard GitHub-hosted runners don't have KVM/hardware acceleration,
      # so a full emulator boot (tried in an earlier run) just hung instead of
      # giving a crash log. This is a cheap static sanity check instead: dump
      # the built APK's manifest/badging so obviously broken entries (missing
      # launcher activity, bad package name, etc.) show up in the job log
      # without needing to actually run it anywhere.
      - name: Dump APK badging (static sanity check)
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2" dump badging \
            android/app/build/outputs/apk/release/app-release.apk
