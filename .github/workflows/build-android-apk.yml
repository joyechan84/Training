name: Build WorshipBand AI Android APK

on:
  workflow_dispatch: {}

defaults:
  run:
    working-directory: worshipband-ai

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: worshipband-ai/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Remove expo-dev-client for this standalone build
        # expo-dev-client (and its expo-dev-launcher/expo-dev-menu deps) is
        # dev-only tooling: during `expo prebuild` it rewrites the generated
        # MainApplication/MainActivity to boot into a "connect to a Metro dev
        # server" launcher instead of the app itself. Standalone/preview
        # builds shouldn't include it at all (this mirrors how EAS itself
        # only includes it in "development" build profiles, never
        # "preview"/"production"). --no-save keeps this local to the CI
        # runner's checkout; package.json/lockfile in the repo are untouched,
        # so `expo start --dev-client` still works for local dev.
        run: npm uninstall expo-dev-client --no-save

      - name: Expo prebuild (generate native android/ project)
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild -p android --no-install

      - name: Build release APK
        # A debug build (assembleDebug) doesn't embed the JS bundle — it expects
        # a Metro dev server to connect to at runtime, which is why opening it
        # shows the "Development servers" launcher screen instead of the app.
        # assembleRelease bundles the JS into the APK (signed with the default
        # debug keystore, since no custom release signing is configured here)
        # so it launches standalone on the tablet with no dev server needed.
        working-directory: worshipband-ai/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: worshipband-ai-release-apk
          path: worshipband-ai/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Dump APK badging (static sanity check)
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2" dump badging \
            android/app/build/outputs/apk/release/app-release.apk

  emulator-crash-check:
    # Standard ubuntu-latest runners have no KVM/hardware acceleration, so a
    # full emulator boot there (tried once) just hung instead of giving a
    # crash log. macos-latest runners have hardware-accelerated virtualization
    # (Apple Hypervisor framework) and can boot an arm64 Android emulator —
    # matching a real arm64 phone (e.g. Galaxy S23) much more closely than an
    # x86_64 image would — in a couple of minutes.
    needs: build-apk
    runs-on: macos-latest
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: worshipband-ai-release-apk
          path: apk

      - name: Boot emulator, install + launch APK, capture crash logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          force-avd-creation: false
          # Kept to just -no-window this time — the previous run's emulator
          # never came up at all (adb never saw the device even once before
          # timing out), which points at one of the extra flags
          # (-no-audio/-camera-back) failing to parse rather than a slow boot.
          emulator-options: -no-window
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r apk/app-release.apk
            adb shell monkey -p com.worshipbandai.app -c android.intent.category.LAUNCHER 1
            sleep 10
            echo "----- resumed activity -----"
            adb shell dumpsys activity activities | grep -A5 mResumedActivity || true
            adb logcat -d > /tmp/full-logcat.txt
            echo "----- FATAL/AndroidRuntime/worshipbandai/ReactNativeJS lines -----"
            grep -E "FATAL EXCEPTION|AndroidRuntime|worshipbandai|ReactNativeJS" /tmp/full-logcat.txt | tail -300 || echo "(no matching lines found)"

      - name: Upload full logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: /tmp/full-logcat.txt
          retention-days: 14
