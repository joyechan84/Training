name: Build WorshipBand AI Android APK

on:
  workflow_dispatch: {}

defaults:
  run:
    working-directory: worshipband-ai

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: worshipband-ai/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (generate native android/ project)
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild -p android --no-install

      - name: Build release APK
        # A debug build (assembleDebug) doesn't embed the JS bundle — it expects
        # a Metro dev server to connect to at runtime, which is why opening it
        # shows the "Development servers" launcher screen instead of the app.
        # assembleRelease bundles the JS into the APK (signed with the default
        # debug keystore, since no custom release signing is configured here)
        # so it launches standalone on the tablet with no dev server needed.
        working-directory: worshipband-ai/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: worshipband-ai-release-apk
          path: worshipband-ai/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
