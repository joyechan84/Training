name: Build WorshipBand AI Android APK

on:
  workflow_dispatch: {}

defaults:
  run:
    working-directory: worshipband-ai

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: worshipband-ai/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (generate native android/ project)
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild -p android --no-install

      - name: Build debug APK
        working-directory: worshipband-ai/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: worshipband-ai-debug-apk
          path: worshipband-ai/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
