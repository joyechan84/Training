name: Build WorshipBand AI Android APK

on:
  workflow_dispatch: {}

defaults:
  run:
    working-directory: worshipband-ai

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: worshipband-ai/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (generate native android/ project)
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild -p android --no-install

      - name: Build release APK
        # A debug build (assembleDebug) doesn't embed the JS bundle — it expects
        # a Metro dev server to connect to at runtime, which is why opening it
        # shows the "Development servers" launcher screen instead of the app.
        # assembleRelease bundles the JS into the APK (signed with the default
        # debug keystore, since no custom release signing is configured here)
        # so it launches standalone on the tablet with no dev server needed.
        working-directory: worshipband-ai/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: worshipband-ai-release-apk
          path: worshipband-ai/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      # A real device install "installs fine but won't open" (crash on launch).
      # There's no way to pull logcat off that phone from here, so reproduce it
      # on an emulator in CI instead and capture the actual crash trace.
      - name: Boot emulator, install + launch APK, capture crash logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r worshipband-ai/android/app/build/outputs/apk/release/app-release.apk
            adb shell monkey -p com.worshipbandai.app -c android.intent.category.LAUNCHER 1
            sleep 10
            adb shell dumpsys activity activities | grep -A5 mResumedActivity || true
            adb logcat -d > /tmp/full-logcat.txt
            echo "----- FATAL/AndroidRuntime/worshipbandai lines -----"
            grep -E "FATAL EXCEPTION|AndroidRuntime|worshipbandai|ReactNativeJS" /tmp/full-logcat.txt | tail -200 || echo "(no matching lines found)"

      - name: Upload full logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: /tmp/full-logcat.txt
          retention-days: 14
