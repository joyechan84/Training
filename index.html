<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>토익 단어장</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 로그인 게이트 -->
  <div id="login-gate" class="login-gate">
    <form id="login-form" class="login-card">
      <span class="eyebrow">Vocabulary Notebook</span>
      <h1>누구의 단어장인가요?</h1>
      <p class="login-caption">이름을 입력하면 학습 기록이 그 이름으로 저장돼요. 비밀번호 없이 이 브라우저에서만 구분됩니다.</p>
      <input type="text" id="login-nickname" placeholder="이름 또는 닉네임" maxlength="20" autocomplete="off" />
      <button type="submit" class="primary-btn">시작하기</button>
      <div id="known-users" class="known-users" hidden>
        <span class="known-users-label">최근 사용자</span>
        <div id="known-users-list" class="known-users-list"></div>
      </div>
    </form>
  </div>

  <div id="app-shell" hidden>
    <header class="app-header">
      <div class="masthead">
        <span class="eyebrow">Vocabulary Notebook</span>
        <h1>토익 단어장</h1>
        <div class="user-chip">
          <span id="current-user-label"></span>
          <button id="switch-user-btn" type="button">전환</button>
        </div>
      </div>
      <nav class="tabs">
        <button class="tab-btn active" data-view="cards">단어학습</button>
        <button class="tab-btn" data-view="study">예문보기</button>
        <button class="tab-btn" data-view="quiz">단어퀴즈</button>
        <button class="tab-btn" data-view="wordbook">나만의 단어장</button>
      </nav>
    </header>

    <main>
    <!-- 단어학습 (플래시카드) -->
    <section id="view-cards" class="view active">
      <div class="toolbar">
        <span id="card-position" class="count-badge"></span>
        <span class="hint-text">카드를 클릭하면 뜻과 예문이 보여요 · ← → 키로 이동</span>
      </div>
      <div id="flashcard" class="flashcard" tabindex="0"></div>
      <div class="card-nav">
        <button id="card-prev" class="nav-btn">◀ 이전</button>
        <button id="card-bookmark" class="bookmark-btn"></button>
        <button id="card-next" class="nav-btn">다음 ▶</button>
      </div>
    </section>

    <!-- 예문보기 -->
    <section id="view-study" class="view">
      <div class="toolbar">
        <input type="text" id="search-input" placeholder="단어 검색..." />
        <span id="study-count" class="count-badge"></span>
      </div>
      <div id="word-list" class="word-list"></div>
    </section>

    <!-- 단어퀴즈 -->
    <section id="view-quiz" class="view">
      <div class="quiz-setup">
        <div class="quiz-mode-select">
          <button class="mode-btn active" data-mode="fill">예문에 넣기</button>
          <button class="mode-btn" data-mode="match">단어-뜻 짝짓기</button>
        </div>
        <div class="quiz-source-select">
          <label><input type="radio" name="quiz-source" value="all" checked /> 전체 단어</label>
          <label><input type="radio" name="quiz-source" value="wordbook" /> 나만의 단어장 (<span id="wordbook-source-count">0</span>)</label>
        </div>
        <button id="start-quiz-btn" class="primary-btn">퀴즈 시작</button>
      </div>
      <div id="quiz-area" class="quiz-area"></div>
    </section>

    <!-- 나만의 단어장 -->
    <section id="view-wordbook" class="view">
      <div class="toolbar">
        <h2>모르는 단어장</h2>
        <span id="wordbook-count" class="count-badge"></span>
      </div>
      <div id="wordbook-list" class="word-list"></div>
      <p id="wordbook-empty" class="empty-msg" hidden>아직 등록된 단어가 없어요. '예문보기'에서 모르는 단어를 추가해보세요!</p>
    </section>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
